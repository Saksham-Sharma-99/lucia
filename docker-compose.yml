name: lucia

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lucia
      POSTGRES_PASSWORD: lucia
      POSTGRES_DB: lucia
    ports:
      - "5433:5432"  # host 5433: a native Postgres often owns 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucia -d lucia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
